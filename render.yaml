services:
  - type: web
    name: emptynet
    runtime: node
    plan: free
    autoDeployTrigger: checksPass
    buildCommand: npm install && npm run prepare:assets && npm run check
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        sync: false
