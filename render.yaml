services:
  - type: web
    name: emptynet
    runtime: node
    plan: starter
    autoDeployTrigger: checksPass
    buildCommand: npm run prepare:assets && npm run check
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATA_DIR
        value: /var/data
    disk:
      name: emptynet-world
      mountPath: /var/data
      sizeGB: 1
