name: Bootstrap EMPTYNET source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.bootstrap/**'
      - 'scripts/assemble-app.mjs'
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Assemble source
        run: node scripts/assemble-app.mjs
      - name: Fetch CC0 assets
        run: node scripts/fetch-assets.mjs
      - name: Validate
        run: npm run check
      - name: Commit canonical source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/app.js public/assets
          git rm -r .bootstrap scripts/assemble-app.mjs .github/workflows/bootstrap.yml
          git commit -m 'Bootstrap canonical EMPTYNET v0.8.0 source'
          git push
