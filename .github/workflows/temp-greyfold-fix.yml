name: TEMP Greyfold init fix
on:
  push:
    branches: [autonomy/2026-08-17]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: autonomy/2026-08-17
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Initialize Mara on her route
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('public/shepherd-outpost.js')
          s = p.read_text()
          old = "  const shepherd = buildShepherd();\n  const sheep = Array.from({ length: 5 }, (_, i) => buildSheep(i));"
          new = "  const shepherd = buildShepherd();\n  const [shepherdStartX, shepherdStartZ] = shepherd.route[0];\n  shepherd.group.position.set(shepherdStartX, ground(shepherdStartX, shepherdStartZ), shepherdStartZ);\n  shepherd.routeIndex = 1;\n  const sheep = Array.from({ length: 5 }, (_, i) => buildSheep(i));"
          if old not in s:
              raise SystemExit('target not found')
          p.write_text(s.replace(old, new, 1))
          PY
          npm check
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name hc6q
          git config user.email heitormilanesi214168@sou.urcamp.edu.br
          rm .github/workflows/temp-greyfold-fix.yml
          git add public/shepherd-outpost.js .github/workflows/temp-greyfold-fix.yml
          git commit -m "Place Mara on the Greyfold patrol route"
          git push origin HEAD:autonomy/2026-08-17
