<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>EMPTYNET // field node</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <section id="gate" class="panel gate-panel">
    <div class="eyebrow">PUBLIC ACCESS NODE 06</div>
    <div class="brand">EMPTYNET</div>
    <div class="sub">a persistent seeded field on the old network</div>
    <div class="seed-row"><span>SEED</span><span>FIELD-28031997</span></div>
    <div class="status-row"><span>NODE</span><span id="node-status">OFFLINE</span></div>
    
    <div class="avatar-label">CHOOSE SHELL</div>
    <div class="avatar-grid">
      <button class="avatar-card active" type="button" data-avatar="wanderer">
        <span class="avatar-preview preview-wanderer"></span>
        <span class="avatar-name">WANDERER</span>
      </button>
      <button class="avatar-card" type="button" data-avatar="surveyor">
        <span class="avatar-preview preview-surveyor"></span>
        <span class="avatar-name">SURVEYOR</span>
      </button>
      <button class="avatar-card" type="button" data-avatar="hermit">
        <span class="avatar-preview preview-hermit"></span>
        <span class="avatar-name">HERMIT</span>
      </button>
      <button class="avatar-card" type="button" data-avatar="runner">
        <span class="avatar-preview preview-runner"></span>
        <span class="avatar-name">RUNNER</span>
      </button>
    </div>
    <input id="name" maxlength="18" autocomplete="off" spellcheck="false" placeholder="guest name" />
    <button id="connect">CONNECT</button>
    <div class="tiny">WASD move · mouse look · E interact · T chat · N leave note · M audio</div>
  </section>

  <div id="game" class="hidden">
    <canvas id="view"></canvas>
    <div id="loading">entering field…</div>
    <div id="crosshair"><span></span></div>
    <div id="lock-help">click to enter</div>

    <div id="hud" class="hud-block">
      <div id="room">MEADOW</div>
      <div id="coords">0.0 / 0.0</div>
    </div>

    <div id="presence" class="hud-block right">NO LOCAL SIGNALS</div>
    <div id="audio-state" class="hud-block audio">AUDIO ON</div>
    <div id="feed"></div>
    <div id="hint"></div>

    <div id="screen-fx"></div>
    <div id="grain"></div>
  </div>

  <div id="prompt" class="panel modal hidden">
    <div id="prompt-title" class="modal-title">INPUT</div>
    <textarea id="prompt-text" maxlength="800" spellcheck="false"></textarea>
    <div class="row"><button id="prompt-ok">SAVE</button><button id="prompt-cancel" class="quiet">CANCEL</button></div>
  </div>

  <div id="terminal" class="panel terminal-panel hidden">
    <div id="terminal-title" class="modal-title">TERMINAL</div>
    <pre id="terminal-log"></pre>
    <textarea id="terminal-input" maxlength="800" spellcheck="false" placeholder="append message…"></textarea>
    <div class="row"><button id="terminal-write">APPEND</button><button id="terminal-close" class="quiet">CLOSE</button></div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="app.js"></script>
</body>
</html>
